<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TISA 基金透視雷達</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --warn-bg: #fef2f2;
      --warn-text: #b91c1c;
      --warn-border: #fecaca;
      --ok-bg: #f0fdf4;
      --ok-text: #15803d;
      --ok-border: #bbf7d0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 28px 18px 60px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.55rem;
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .meta {
      text-align: right;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.6;
    }
    .meta strong {
      color: var(--text);
      font-weight: 700;
    }
    .meta .count-highlight {
      color: var(--primary);
    }
    @media (max-width: 640px) {
      .meta { text-align: left; }
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 20px;
    }
    .toolbar input[type="text"],
    .toolbar select {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.92rem;
      background: #fff;
      color: var(--text);
    }
    .toolbar input[type="text"] {
      flex: 1 1 220px;
    }
    .toggle-btn {
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
      transition: all 0.15s;
    }
    .toggle-btn.active {
      background: var(--warn-bg);
      color: var(--warn-text);
      border-color: var(--warn-border);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(460px, 1fr));
      gap: 18px;
    }
    @media (max-width: 540px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .fund-id {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
    }
    .fund-name {
      margin: 2px 0 6px;
      font-size: 1.12rem;
      font-weight: 700;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      font-size: 0.78rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: #f1f5f9;
      color: #334155;
    }
    .badge {
      white-space: nowrap;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid;
    }
    .badge.warn {
      background: var(--warn-bg);
      color: var(--warn-text);
      border-color: var(--warn-border);
    }
    .badge.ok {
      background: var(--ok-bg);
      color: var(--ok-text);
      border-color: var(--ok-border);
    }
    .ai-box {
      background: #f8fafc;
      border-left: 3px solid var(--primary);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.92rem;
    }
    .ai-box p { margin: 0 0 6px; }
    .ai-box p:last-child { margin-bottom: 0; color: var(--muted); font-size: 0.86rem; }
