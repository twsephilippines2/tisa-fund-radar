<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TISA 基金透視雷達</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --warn-bg: #fef2f2;
      --warn-text: #b91c1c;
      --warn-border: #fecaca;
      --ok-bg: #f0fdf4;
      --ok-text: #15803d;
      --ok-border: #bbf7d0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 28px 18px 60px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.55rem;
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .meta {
      text-align: right;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.6;
    }
    .meta strong {
      color: var(--text);
      font-weight: 700;
    }
    .meta .count-highlight {
      color: var(--primary);
    }
    @media (max-width: 640px) {
      .meta { text-align: left; }
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 20px;
    }
    .toolbar input[type="text"],
    .toolbar select {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.92rem;
      background: #fff;
      color: var(--text);
    }
    .toolbar input[type="text"] {
      flex: 1 1 220px;
    }
    .toggle-btn {
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
      transition: all 0.15s;
    }
    .toggle-btn.active {
      background: var(--warn-bg);
      color: var(--warn-text);
      border-color: var(--warn-border);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(460px, 1fr));
      gap: 18px;
    }
    @media (max-width: 540px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .fund-id {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
    }
    .fund-name {
      margin: 2px 0 6px;
      font-size: 1.12rem;
      font-weight: 700;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      font-size: 0.78rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: #f1f5f9;
      color: #334155;
    }
    .badge {
      white-space: nowrap;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid;
    }
    .badge.warn {
      background: var(--warn-bg);
      color: var(--warn-text);
      border-color: var(--warn-border);
    }
    .badge.ok {
      background: var(--ok-bg);
      color: var(--ok-text);
      border-color: var(--ok-border);
    }
    .ai-box {
      background: #f8fafc;
      border-left: 3px solid var(--primary);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.92rem;
    }
    .ai-box p { margin: 0 0 6px; }
    .ai-box p:last-child { margin-bottom: 0; color: var(--muted); font-size: 0.86rem; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      text-align: center;
    }
    .metric-item {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 4px;
    }
    .metric-label {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .metric-val {
      font-size: 1rem;
      font-weight: 700;
      margin-top: 2px;
    }
    .section-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .holdings-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip {
      font-size: 0.82rem;
      padding: 3px 9px;
      border-radius: 6px;
      background: #eff6ff;
      color: #1d4ed8;
    }
    .diff-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.82rem;
    }
    .diff-add { background: #dcfce7; color: #166534; padding: 2px 8px; border-radius: 6px; }
    .diff-rem { background: #fee2e2; color: #991b1b; padding: 2px 8px; border-radius: 6px; }
    .rule-note {
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px dashed var(--border);
      padding-top: 8px;
    }
    .status-msg {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>TISA 基金透視雷達</h1>
        <p class="subtitle">穿透基金名稱看實際持股集中度、ETF 重疊率與風險指標</p>
      </div>
      <div class="meta" id="metaInfo">資料載入中...</div>
    </header>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="搜尋基金名稱、代號或投信..." />
      <select id="tisaTypeSelect">
        <option value="ALL">全部 TISA 類型</option>
        <option value="TISA級別">TISA級別</option>
        <option value="好好退休">好好退休</option>
        <option value="好享退">好享退</option>
        <option value="TISA專區">TISA專區</option>
      </select>
      <select id="riskSelect">
        <option value="ALL">全部風險等級</option>
        <option value="RR1">RR1</option>
        <option value="RR2">RR2</option>
        <option value="RR3">RR3</option>
        <option value="RR4">RR4</option>
        <option value="RR5">RR5</option>
      </select>
      <select id="sortSelect">
        <option value="DEFAULT">預設排序</option>
        <option value="TECH_DESC">科技股占比：高 → 低</option>
        <option value="OVERLAP_DESC">0050 重疊率：高 → 低</option>
        <option value="SHARPE_DESC">夏普值：高 → 低</option>
        <option value="MDD_ASC">最大回撤：小 → 大</option>
      </select>
      <button class="toggle-btn" id="mismatchOnlyBtn">只看「名實不符」警示</button>
    </div>

    <div id="content" class="status-msg">正在讀取 data/funds.json...</div>
  </div>

  <script>
    let allFunds = [];
    let metaData = {
      totalCount: 0,
      holdingsAsOf: "-",
      updatedAt: "-",
      source: "基富通 FundRich TISA 專區"
    };
    let mismatchOnly = false;

    function updateMetaHeader(shownCount) {
      document.getElementById("metaInfo").innerHTML =
        `收錄總數：<strong class="count-highlight">共 ${metaData.totalCount} 筆</strong>（目前顯示 <strong>${shownCount}</strong> 筆）<br>` +
        `持股基準日：<strong>${metaData.holdingsAsOf}</strong> ｜ 系統更新時間：<strong>${metaData.updatedAt}</strong><br>` +
        `資料來源：${metaData.source}`;
    }

    async function loadFunds() {
      const contentEl = document.getElementById("content");
      try {
        const res = await fetch(`./data/funds.json?t=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        allFunds = data.funds || [];
        metaData = {
          totalCount: data.total_count ?? allFunds.length,
          holdingsAsOf: data.holdings_as_of || "-",
          updatedAt: data.updated_at || "-",
          source: data.source || "基富通 FundRich TISA 專區"
        };

        render();
      } catch (err) {
        contentEl.innerHTML = `無法載入 data/funds.json（${err.message}）。請確認檔案路徑正確並透過網頁伺服器或 GitHub Pages 開啟。`;
      }
    }

    function render() {
      const contentEl = document.getElementById("content");
      const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
      const tisaType = document.getElementById("tisaTypeSelect").value;
      const riskLevel = document.getElementById("riskSelect").value;
      const sortBy = document.getElementById("sortSelect").value;

      let filtered = allFunds.filter((f) => {
        const matchKeyword =
          !keyword ||
          (f.name || "").toLowerCase().includes(keyword) ||
          (f.id || "").toLowerCase().includes(keyword) ||
          (f.issuer || "").toLowerCase().includes(keyword);
        const matchType = tisaType === "ALL" || f.tisa_type === tisaType;
        const matchRisk = riskLevel === "ALL" || f.risk_level === riskLevel;
        const matchFlag = !mismatchOnly || (f.ai_diagnosis && f.ai_diagnosis.style_mismatch_flag);
        return matchKeyword && matchType && matchRisk && matchFlag;
      });

      if (sortBy === "TECH_DESC") {
        filtered = [...filtered].sort((a, b) => (b.tech_exposure_pct || 0) - (a.tech_exposure_pct || 0));
      } else if (sortBy === "OVERLAP_DESC") {
        filtered = [...filtered].sort((a, b) => (b.overlap_0050_pct || 0) - (a.overlap_0050_pct || 0));
      } else if (sortBy === "SHARPE_DESC") {
        filtered = [...filtered].sort((a, b) => ((b.risk || {}).sharpe_ratio || -99) - ((a.risk || {}).sharpe_ratio || -99));
      } else if (sortBy === "MDD_ASC") {
        filtered = [...filtered].sort((a, b) => ((b.risk || {}).max_drawdown_pct || -999) - ((a.risk || {}).max_drawdown_pct || -999));
      }

      updateMetaHeader(filtered.length);

      if (filtered.length === 0) {
        contentEl.className = "status-msg";
        contentEl.textContent = "找不到符合條件的基金。";
        return;
      }

      contentEl.className = "grid";
      contentEl.innerHTML = filtered.map((f) => {
        const diag = f.ai_diagnosis || {};
        const risk = f.risk || {};
        const diff = f.holdings_diff || {};
        const isWarn = Boolean(diag.style_mismatch_flag);

        const holdingsHtml = (f.top_holdings || [])
          .map((h) => `<span class="chip">${h.name} ${h.weight}%</span>`)
          .join("");

        const addedHtml = (diff.added || [])
          .map((s) => `<span class="diff-add">+ 新增 ${s}</span>`)
          .join("");
        const removedHtml = (diff.removed || [])
          .map((s) => `<span class="diff-rem">- 剔除 ${s}</span>`)
          .join("");

        return `
          <article class="card">
            <div class="card-top">
              <div>
                <div class="fund-id">${f.id} · ${f.issuer}</div>
                <h2 class="fund-name">${f.name}</h2>
                <div class="tags">
                  <span class="tag">${f.tisa_type}</span>
                  <span class="tag">${f.category}</span>
                  <span class="tag">${f.risk_level}</span>
                  <span class="tag">總費用率 ${f.ter_pct}%</span>
                </div>
              </div>
              <span class="badge ${isWarn ? "warn" : "ok"}">
                ${diag.mismatch_badge || (isWarn ? "風格落差" : "名實相符")}
              </span>
            </div>

            <div class="ai-box">
              <p><strong>AI 透視診斷：</strong>${diag.plain_summary || "尚無摘要"}</p>
              <p><strong>動向觀察：</strong>${diag.radar_action_note || "-"}</p>
            </div>

            <div class="metrics">
              <div class="metric-item">
                <div class="metric-label">科技股占比</div>
                <div class="val">${f.tech_exposure_pct}%</div>
              </div>
              <div class="metric-item">
                <div class="metric-label">0050 重疊率</div>
                <div class="val">${f.overlap_0050_pct}%</div>
              </div>
              <div class="metric-item">
                <div class="metric-label">最大回撤</div>
                <div class="val">${risk.max_drawdown_pct}%</div>
              </div>
              <div class="metric-item">
                <div class="metric-label">夏普值 / 波動</div>
                <div class="val">${risk.sharpe_ratio} / ${risk.annual_volatility_pct}%</div>
              </div>
            </div>

            <div>
              <div class="section-title">主要持股（台積電 ${f.tsmc_pct}% · 00878 重疊 ${f.overlap_00878_pct}%）</div>
              <div class="holdings-list">${holdingsHtml || "無資料"}</div>
            </div>

            ${(addedHtml || removedHtml) ? `
              <div>
                <div class="section-title">近期成分股異動</div>
                <div class="diff-row">${addedHtml}${removedHtml}</div>
              </div>
            ` : ""}

            <div class="rule-note">方案備註：${f.rule_note || "無"}</div>
          </article>
        `;
      }).join("");
    }

    document.getElementById("searchInput").addEventListener("input", render);
    document.getElementById("tisaTypeSelect").addEventListener("change", render);
    document.getElementById("riskSelect").addEventListener("change", render);
    document.getElementById("sortSelect").addEventListener("change", render);
    document.getElementById("mismatchOnlyBtn").addEventListener("click", (e) => {
      mismatchOnly = !mismatchOnly;
      e.currentTarget.classList.toggle("active", mismatchOnly);
      render();
    });

    loadFunds();
  </script>
</body>
</html>
