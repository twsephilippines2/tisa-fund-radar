name: Update TISA Funds JSON with Gemini

on:
  schedule:
    - cron: '30 23 * * 0' # 每週日 UTC 23:30（台灣時間週一早上 07:30）自動執行
  workflow_dispatch:      # 支援在 GitHub 網頁上手動一鍵觸發

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-genai pandas numpy pydantic

      - name: Run data & AI pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python pipeline/build_funds.py

      - name: Commit updated funds.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/funds.json
          git diff --staged --quiet || git commit -m "chore: update TISA funds data and AI insights"
          git push
