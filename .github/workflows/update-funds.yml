name: Update TISA Funds JSON with Gemini

on:
  workflow_dispatch: {}
  schedule:
    # 每天台灣時間上午 08:30（UTC 00:30）自動更新一次
    - cron: "30 0 * * *"

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r pipeline/requirements.txt
          pip install playwright beautifulsoup4 requests numpy pydantic google-genai
          playwright install chromium
          playwright install-deps chromium

      - name: Fetch TISA funds from FundRich
        run: python pipeline/fetch_funds.py

      - name: Run data & AI pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python pipeline/build_funds.py

      - name: Commit updated data files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/raw_funds.json data/funds.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily update TISA funds data and AI insights"
            git push
          fi
