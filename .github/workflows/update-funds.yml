name: Update TISA Funds JSON with Gemini

on:
  schedule:
    - cron: '30 23 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install google-genai pandas numpy pydantic
      - name: Run data & AI pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python pipeline/build_funds.py
      - name: Commit updated funds.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/funds.json
          git diff --staged --quiet || git commit -m "chore: update TISA funds data and AI insights"
          git push
